services:
  bigdata-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bigdata-service-mcp
    ports:
      - "8765:8765"
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s